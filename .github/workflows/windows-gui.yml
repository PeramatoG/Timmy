name: Windows GUI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure native wxWidgets GUI and deterministic tests
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DTIMMY_BUILD_GUI=ON -DBUILD_TESTING=ON
          -DTIMMY_ENABLE_VULKAN=OFF -DGGML_NATIVE=OFF

      - name: Build GUI, CLI, and tests
        run: cmake --build build --config Debug --parallel 2

      - name: Run tests including initial window layout
        run: ctest --test-dir build -C Debug --output-on-failure
