name: Linux GUI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwxgtk3.2-dev xvfb xauth

      - name: Configure with GUI and deterministic tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTIMMY_BUILD_GUI=ON -DBUILD_TESTING=ON -DGGML_NATIVE=OFF

      - name: Build GUI, CLI, and tests
        run: cmake --build build --parallel 2

      - name: Run tests on a virtual display
        run: xvfb-run -a ctest --test-dir build --output-on-failure
